customization:
  distribution_code_name: Weasel
  distribution_version: 0.16.3
  generator: "Weasel::UIStyleSettings"
  modified_time: "Fri Dec 27 10:22:59 2024"
  rime_version: 1.11.2
patch:
  style:
    label_format: "%s." # 候选词前序号的风格 1. 这种风格
    # color_scheme: ms_sogou
    color_scheme: ms_wechat_light
    # color_scheme: ms_wechat_dark
    translucency: true # 透明
    font_face: "Maple Mono NF CN" # 候选词字体
    font_point: 14 # 候选词大小
    horizontal: true  # 候选词水平显示
    inline_preedit: true  # 候选词指示器独立显示
    label_font_point: 14 # 序号大小
    layout:
      baseline: 0
      linespacing: 0
      align_type: center # 候选词对齐方式
      max_height: 0
      max_width: 0
      min_height: 0
      min_width: 160
      type: horizontal
      border_width: 1
      margin_x: 6 # 候选词和边框水平之间空白距离
      margin_y: 6 # 候选词和边框垂直之间空白距离
      spacing: 10
      candidate_spacing: 5 # 候选词之间间距
      hilite_spacing: 4 # 序号与候选词之间的边距
      hilite_padding: 2
      # hilite_padding_x: 2
      # hilite_padding_y: 2
      shadow_offset_x: 4
      shadow_offset_y: 4
      shadow_radius: 0
      corner_radius: 4
      round_corner: 4

  preset_color_schemes:
    ms_sogou:
      name: 搜狗
      author: Mark24Code
      back_color: 0xFFFFFF
      border_color: 0xFFFFFF
      text_color: 0xD9884F
      hilited_text_color: 0xD9884F
      hilited_back_color: 0xFFFFFF
      hilited_candidate_text_color: 0x0D4FE9
      hilited_candidate_back_color: 0xFFFFFF
      candidate_text_color: 0xD67F42
      comment_text_color: 0xFFFFFF

    ms_wechat_light:
      name: 微信light
      author: Mark24Code
      back_color: 0xFFFFFF
      #border_color: 0xFFFFFF
      border_color: 0xE0E0E0 # 这里如果设置和text_color同色看不出来区别就没有了边界感，候选词边框颜色
      text_color: 0x69AD2E
      hilited_text_color: 0xFFFFFF
      hilited_back_color: 0x69AD2E
      hilited_candidate_text_color: 0xFFFFFF
      hilited_candidate_back_color: 0x69AD2E
      candidate_text_color: 0x69AD2E
      hilited_comment_text_color: 0x8E8E8E # 拼音注解选中时的颜色
      comment_text_color: 0x999999 # 拼音注解未选中时的颜色

    ms_wechat_dark:
      name: 微信dark
      author: Mark24Code
      back_color: 0x000000
      border_color: 0x000000
      text_color: 0x69AD2E
      hilited_text_color: 0xD8D8D8
      hilited_back_color: 0x69AD2E
      hilited_candidate_text_color: 0xD8D8D8
      hilited_candidate_back_color: 0x69AD2E
      candidate_text_color: 0x69AD2E
      comment_text_color: 0xFFFFFF
